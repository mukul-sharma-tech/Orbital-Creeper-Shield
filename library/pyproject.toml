[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anudesh-kavach"
version = "0.1.0"
description = "Prompt safety detection using the Orbital Creeper Shield models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40,<5",
    "sentence-transformers>=2.6",
    "sentencepiece>=0.1.99",
]

[tool.setuptools]
packages = ["anudesh_kavach"]
